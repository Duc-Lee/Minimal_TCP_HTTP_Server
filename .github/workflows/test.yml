name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-misc clang-format bc python3

      - name: Check code formatting
        run: |
          make fmt && git diff --exit-code
        continue-on-error: true

      - name: Build kernel and filesystem
        run: |
          make kernel/kernel fs.img

      - name: Run usertests
        run: |
          python3 ./test-xv6.py usertests

      - name: Run crash test
        run: |
          python3 ./test-xv6.py crash

  macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: brew install riscv64-elf-gcc

      - name: Build kernel and filesystem
        run: |
          make kernel/kernel fs.img
